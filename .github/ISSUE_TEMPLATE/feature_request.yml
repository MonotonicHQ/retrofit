name: Suggestion
description: A change you would like retrofit to make, or a schema change it cannot express.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The schema change or workflow, and where retrofit falls short today.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do instead
      description: How you work around it now, if you do.
  - type: input
    id: version
    attributes:
      label: retrofit version
      description: The output of `retrofit --version`, if you have it installed.
